blueprint:
  name: IKEA RODRET E2201 - Çift Bağımsız Işık / Röle Kontrolü
  description: >-
    IKEA RODRET E2201 kumandanın Açma (I) ve Kapatma (O) tuşlarını iki farklı
    ışık veya Sonoff ZBMINIL2 röle için bağımsız toggle (aç/kapa) anahtarı olarak çalıştırır.
  domain: automation
  input:
    remote_device:
      name: IKEA RODRET Kumanda
      description: Kontrol sağlayacak RODRET cihazını seçin (ZHA veya Z2M).
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
            - integration: mqtt
              manufacturer: IKEA
          multiple: false

    light_1:
      name: 1. Işık / Röle (Üst Tuş - I)
      description: Üst tuşa basıldığında durumu tersine çevrilecek (toggle) cihaz.
      selector:
        target:
          entity:
            - domain: light
            - domain: switch

    light_2:
      name: 2. Işık / Röle (Alt Tuş - O)
      description: Alt tuşa basıldığında durumu tersine çevrilecek (toggle) cihaz.
      selector:
        target:
          entity:
            - domain: light
            - domain: switch

mode: restart
max_exceeded: silent

trigger:
  # Zigbee2MQTT Tetikleyicileri
  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: "on"
    id: button_up

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: "off"
    id: button_down

  # ZHA Tetikleyicileri
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote_device
      command: "on"
      endpoint_id: 1
    id: button_up

  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote_device
      command: "off"
      endpoint_id: 1
    id: button_down

action:
  - choose:
      - conditions:
          - condition: trigger
            id: button_up
        sequence:
          - action: homeassistant.toggle
            target: !input light_1

      - conditions:
          - condition: trigger
            id: button_down
        sequence:
          - action: homeassistant.toggle
            target: !input light_2
