homeassistant:
  min_version: 2025.12.1
  author: censay
  domain: automation
  name: "IKEA RODRET E2201 Zigbee Smart Button - 2 Lights"
  description: "IKEA RODRET E2201 ile iki farklı ışığı kontrol eder."

  input:
    remote_devices:
      name: Remote
      description: IKEA RODRET E2201
      default: []
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
            - integration: mqtt
              manufacturer: IKEA
          multiple: true

    light_on:
      name: Light 1
      description: Açma tuşunun kontrol edeceği ışık
      selector:
        entity:
          filter:
            - domain: light
          multiple: false

    light_off:
      name: Light 2
      description: Kapatma tuşunun kontrol edeceği ışık
      selector:
        entity:
          filter:
            - domain: light
          multiple: false

  mode: restart
  max_exceeded: silent

  triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        command: "on"
        cluster_id: 6
        endpoint_id: 1
      id: tap-on-zha

    - trigger: mqtt
      topic: "+/+/action"
      payload: "on"
      id: tap-on-z2m

    - trigger: event
      event_type: zha_event
      event_data:
        command: "off"
        cluster_id: 6
        endpoint_id: 1
      id: tap-off-zha

    - trigger: mqtt
      topic: "+/+/action"
      payload: "off"
      id: tap-off-z2m

  variables:
    is_mqtt: "{{ trigger.platform == 'mqtt' }}"
    is_zha: "{{ trigger.platform == 'event' and trigger.event.event_type == 'zha_event' }}"
    remote_devices: !input remote_devices
    remote_devices_names: "{{ remote_devices | map('device_attr', 'name') | list }}"

  condition:
    - condition: template
      value_template: "{{ (is_zha and trigger.event.data.device_id in remote_devices) or (is_mqtt and trigger.topic.split('/')[1] in remote_devices_names) }}"

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - tap-on-zha
                - tap-on-z2m
          sequence:
            - service: light.toggle
              target:
                entity_id: !input light_on

        - conditions:
            - condition: trigger
              id:
                - tap-off-zha
                - tap-off-z2m
          sequence:
            - service: light.toggle
              target:
                entity_id: !input light_off
